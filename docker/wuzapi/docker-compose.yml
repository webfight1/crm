# Read-only WhatsApp bridge for the CRM "Vestlused" module.
# One container, SQLite, no media downloads — ~30 MB RAM.
# Runs on the VPS in /opt/wuzapi; see README.md.
services:
  wuzapi:
    build: https://github.com/asternic/wuzapi.git#v1.0.9
    image: wuzapi:1.0.9
    container_name: wuzapi
    restart: unless-stopped
    # API only on localhost — the CRM (same host) talks to it, nobody else.
    ports:
      - "127.0.0.1:8090:8080"
    command: ["-datadir=/app/data", "-skipmedia", "-logtype=console"]
    environment:
      - WUZAPI_ADMIN_TOKEN=${WUZAPI_ADMIN_TOKEN}
      - WUZAPI_GLOBAL_ENCRYPTION_KEY=${WUZAPI_GLOBAL_ENCRYPTION_KEY}
      - WEBHOOK_FORMAT=json
      - TZ=Europe/Tallinn
      # Never show "online" to contacts and keep phone notifications working.
      - WUZAPI_AUTO_PRESENCE=unavailable
      - SESSION_DEVICE_NAME=CRM
    volumes:
      - ./data:/app/data
    mem_limit: 256m
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }
